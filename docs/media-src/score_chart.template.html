<!doctype html><meta charset="utf-8"><title>Score loop</title>
<style>
*{box-sizing:border-box}
body{margin:0;width:1200px;background:#07140e;color:#e6f4ec;font-family:Inter,system-ui,sans-serif}
.page{padding:44px 44px 34px}
h1{margin:0 0 8px;font-size:36px;line-height:1.15;letter-spacing:-.01em;color:#fff}
.sub{margin:0 0 30px;font-size:18px;color:#9fc4af}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.panel{background:#0e2418;border:1px solid #1f4630;border-radius:16px;padding:22px 24px 20px}
.title{font-size:14px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#86efac}
.score{margin:6px 0 4px;font-size:84px;line-height:1;font-weight:800;letter-spacing:-.03em}
.score small{font-size:26px;font-weight:600;color:#6b9a82;letter-spacing:0;margin-left:4px}
.delta{margin-left:14px;font-size:24px;font-weight:700;color:#4ade80;letter-spacing:0;vertical-align:14px}
.caption{min-height:66px;margin-bottom:12px;font-size:15.5px;line-height:1.4;color:#a9cdb9}
.row{display:grid;grid-template-columns:150px 1fr 52px;align-items:center;gap:10px;margin:9px 0;font-size:15px}
.cat{color:#cfe8da}
.track{display:block;height:12px;border-radius:6px;background:#17392a;overflow:hidden}
.track i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#22c55e,#86efac)}
.val{text-align:right;font:600 14px 'DejaVu Sans Mono',monospace;color:#cfe8da}
.note{margin:22px 0 0;font-size:15.5px;line-height:1.5;color:#9fc4af}
.foot{margin-top:10px;font-size:13px;color:#6b9a82}
</style>
<div class="page">
<h1>One page, three audits: {{HEADLINE}}</h1>
<p class="sub">A made-up bike shop page from the bundled fixture, scored by the real page_audit.py.</p>
<div class="grid">
{{PANELS}}
</div>
<p class="note">{{NOTE}}</p>
<p class="foot">Generated by docs/media-src/score_chart.py. Scores come from page_audit.py --json.</p>
</div>
