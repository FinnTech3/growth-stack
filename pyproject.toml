[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "growth-stack"
version = "1.0.0"
description = "Growth Stack: audit a page, fix the biggest gaps in its own voice, set up measurement, re-audit. Fifteen agent skills and three standard-library scripts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "FinnTech3" }]
keywords = ["seo", "marketing", "agent-skills", "site-audit", "conversion"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/FinnTech3/growth-stack"
Issues = "https://github.com/FinnTech3/growth-stack/issues"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "tools"]  # tools/ is shared across repos and linted in its own

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
# The three scripts ship to the buyer as text and must each stay under 20 KB, so they use two-space indents,
# a rubric table with one long line per check, and a few lambdas.
"tests/**" = ["PT018", "E501", "E731", "RUF001", "SIM117", "B018", "RUF012"]
"agensi/**/scripts/*.py" = ["RUF001", "RUF007", "C405", "SIM401", "SIM105", "RUF059", "E501", "E731", "E741", "SIM102", "SIM108", "RUF005", "RUF012", "B905"]
